<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F4F1EB;--paper2:#ECE7DD;--ink:#20232A;--ink2:rgba(32,35,42,.6);--gold:#9C7A2E;--line:rgba(32,35,42,.13)}
body{font-family:'Montserrat',sans-serif;background:var(--paper);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(244,241,235,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-left{display:flex;align-items:center;gap:22px}
.menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:6px}.menu-btn span{width:26px;height:1.5px;background:var(--ink);transition:.3s}.menu-btn:hover span{background:var(--gold)}
.logo{height:46px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.lang{display:flex;gap:12px;font-size:12px;letter-spacing:2px}.lang span{opacity:.42;cursor:pointer;transition:.2s}.lang span.on{opacity:1;color:var(--gold);font-weight:600}.lang span:hover{opacity:.85}
/* HERO — B&W cover */
.ahero{position:relative;height:74vh;min-height:480px;overflow:hidden;background:#1a1a1a}
.ahero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.78)}
.ahero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--paper) 1%,transparent 30%,transparent 60%,rgba(0,0,0,.3))}
.ahero-in{position:absolute;left:0;right:0;bottom:8%;padding:0 7%;z-index:2}
.ahero .back{position:absolute;top:96px;left:7%;z-index:3;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:.85;transition:.2s}
.ahero .back:hover{color:var(--gold2,#E8C96A);opacity:1}
.ahero .eg{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#E8C96A;margin-bottom:14px;font-weight:600}
.ahero h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(52px,10vw,128px);line-height:.9;color:#fff;letter-spacing:-1px;text-shadow:0 3px 30px rgba(0,0,0,.5)}
/* BODY */
.wrap{max-width:820px;margin:0 auto;padding:60px 6% 20px}
.bio{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,3vw,30px);line-height:1.5;color:var(--ink);font-weight:500;margin-bottom:50px}
.styles-h{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:600}
.styles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.styles span{border:1px solid var(--line);padding:9px 17px;font-size:13px;letter-spacing:.4px;color:var(--ink2);transition:.2s}
.styles span:hover{border-color:var(--gold);color:var(--ink)}
/* GALLERY */
.gal-sec{max-width:1280px;margin:60px auto 0;padding:0 5%}
.gal-h{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:24px;font-weight:600;text-align:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gal a{display:block;aspect-ratio:3/2;overflow:hidden;background:var(--paper2)}
.gal img{width:100%;height:100%;object-fit:cover;transition:.6s ease}
.gal a:hover img{transform:scale(1.05)}
footer{margin-top:80px;background:var(--ink);color:rgba(244,241,235,.7);padding:50px 6% 36px}
.foot-in{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;align-items:center}
.foot-in .fl{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:2px;color:var(--paper)}
.foot-soc{display:flex;gap:20px;font-size:15px}.foot-soc a{opacity:.7;transition:.2s}.foot-soc a:hover{opacity:1;color:#E8C96A}
.foot-cp{max-width:1280px;margin:28px auto 0;padding-top:20px;border-top:1px solid rgba(244,241,235,.14);font-size:12px;color:rgba(244,241,235,.45);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.foot-cp a:hover{color:#E8C96A}
.drawer{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:86vw;z-index:65;background:var(--paper2);border-right:1px solid var(--line);transform:translateX(-100%);transition:.42s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:100px 0 30px;box-shadow:8px 0 40px rgba(0,0,0,.12)}.drawer.open{transform:translateX(0)}
.drawer-ov{position:fixed;inset:0;z-index:64;background:rgba(32,35,42,.4);opacity:0;pointer-events:none;transition:.4s}.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer nav{flex:1;display:flex;flex-direction:column}.drawer nav a{padding:16px 40px;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink);border-left:2px solid transparent;transition:.22s;opacity:.7}.drawer nav a:hover,.drawer nav a.active{opacity:1;color:var(--gold);border-left-color:var(--gold)}
.drawer-foot{padding:24px 40px 0;border-top:1px solid var(--line);margin-top:14px;font-size:11px;color:var(--ink2);line-height:1.8}
@media(max-width:680px){.logo{height:38px}.ahero{height:64vh}}
</style>
</head>
<body>

<script>
const A={
 'askin-ozturk':{name:"Aşkın Öztürk",genre:{tr:"Kurucu · Emotional Pop-Rock",en:"Founder · Emotional Pop-Rock"},img:"askin-ozturk",gal:4,
   bio:{tr:"Aura Sonic Official'ın kurucusu ve yaratıcı gücü. Türkçe ve İngilizce; gerçek hayat hikâyelerini sinematik bir duyguyla anlatan bir söz-müzik sanatçısı. Tüm katalogun söz ve bestesinin imzası.",en:"Founder and creative force of Aura Sonic Official. A singer-songwriter who tells real-life stories with cinematic emotion, in Turkish and English. The signature behind every lyric and composition on the label."},
   styles:["Türkçe & İngilizce","Emotional Pop-Rock","Cinematic Ballad","Singer-Songwriter","Gerçek hayat hikâyeleri","Organik canlı grup sound'u"]},
 'kael-voss':{name:"Kael Voss",genre:{tr:"Cinematic Story Rock",en:"Cinematic Story Rock"},img:"kael-voss",gal:4,
   bio:{tr:"Sert gitar işçiliğini duygu yüklü vokallerle harmanlayan bir rock gücü. Müziği film gibi hikâye anlatır — ham, dürüst ve derinden insani.",en:"A rock powerhouse blending gritty guitar work with emotionally charged vocals. His music tells stories like a film — raw, honest and deeply human."},
   styles:["Cinematic Story Rock","Alternative Rock","Film gibi hikâye anlatımı"]},
 'vael-cross':{name:"Vael Cross",genre:{tr:"Dark Cinematic Rock",en:"Dark Cinematic Rock"},img:"vael-cross",gal:4,
   bio:{tr:"Karanlık güzellik ve otantiklikle örülmüş atmosferik bir rock vizyoneri. Her parça gölge ve ışık arasında bir yolculuk — sessizlik ile fırtınanın kesiştiği yer.",en:"An atmospheric rock visionary woven with dark beauty and authenticity. Each track a journey between shadow and light — where silence meets storm."},
   styles:["Dark Cinematic Alternative Rock","Arena Rock","Modern Rock"]},
 'maria-mel':{name:"Maria Mel",genre:{tr:"Emotional Soul-Pop",en:"Emotional Soul-Pop"},img:"maria-mel",gal:4,
   bio:{tr:"Nadir bir derinlik ve berraklıkta sese sahip, klasik etkili bir pop sanatçısı. Birden çok dilde aynı zarafetle söyler; modern şarkı yazımına sinematik bir görkem katar.",en:"A classically influenced pop artist with a voice of rare depth and clarity. She performs in multiple languages with equal grace, bringing cinematic grandeur to modern songwriting."},
   styles:["Emotional Pop","Soul-Pop","Cinematic Pop","Fransızca ağırlıklı","İtalyanca repertuvar"]},
 'lyra-sage':{name:"Lyra Sage",genre:{tr:"Spanish Latin Pop",en:"Spanish Latin Pop"},img:"lyra-sage",gal:4,
   bio:{tr:"Modern Latin pop'un sıcak ritmini İspanyolca repertuvarıyla buluşturan bir ses. Şehrin gece ışıkları kadar çekici, dans kadar canlı.",en:"A voice bringing the warm rhythm of modern Latin pop together with a Spanish repertoire. As alluring as city night lights, as alive as dance."},
   styles:["Spanish Latin Pop","Latin Dance","Modern Latin","İspanyolca repertuvar"]},
 'lara':{name:"Lara",genre:{tr:"Global Summer Pop",en:"Global Summer Pop"},img:"lara",gal:4,
   bio:{tr:"Yaz ve festival enerjisini taşıyan global bir pop sesi. Brezilya ve Latin tınılarını yumuşak dans pop'uyla harmanlar; gerektiğinde Türkçe repertuvara uzanır.",en:"A global pop voice carrying summer and festival energy. She blends Brazilian and Latin tones with soft dance pop, reaching into a Turkish repertoire when needed."},
   styles:["Global Summer Pop","Brazilian Pop","Latin Pop","Soft Dance Pop","Türkçe repertuvar"]},
 'jaxen-moon':{name:"Jaxen Moon",genre:{tr:"Americana · Folk-Rock",en:"Americana · Folk-Rock"},img:"jaxen-moon",gal:4,
   bio:{tr:"Americana ve folk-rock'ı soul dokusuyla harmanlayan özgür ruhlu bir müzik gezgini. İnsan hikâyelerini dünyanın kendisi kadar doğal anlatır.",en:"A free-spirited musical wanderer blending Americana and folk-rock with a soulful texture. He tells human stories as naturally as the world itself."},
   styles:["Americana","Folk-Rock","Soul-Rock","Teddy Swims hissiyatı","İnsan hikâyeleri"]},
 'irem-sezin':{name:"İrem Sezin",genre:{tr:"Dramatic Female Rock",en:"Dramatic Female Rock"},img:"irem-sezin",gal:4,
   bio:{tr:"Güçlü kadın vokaliyle sahneye hükmeden, dramatik bir rock sesi. İngilizce ve Türkçe; her performansı otantik bir duygu patlaması.",en:"A dramatic rock voice that commands the stage with a powerful female vocal. In English and Turkish — every performance an authentic burst of emotion."},
   styles:["İngilizce Rock","Türkçe Rock","Dramatic Female Rock","Emotional Pop-Rock","Güçlü kadın vokal"]},
 'naxo-veyra':{name:"Naxo Veyra",genre:{tr:"Latin Urbano · Reggaeton",en:"Latin Urbano · Reggaeton"},img:"naxo-veyra",gal:4,
   bio:{tr:"Latin urbano ve reggaeton füzyonuyla kulüpleri tutuşturan bir enerji. Spanish urban tınısı, modern club sound'u.",en:"An energy that sets clubs alight with Latin urbano and reggaeton fusion. A Spanish-urban tone with a modern club sound."},
   styles:["Latin Urbano","Reggaeton Fusion","Latin Club","Spanish Urban"]},
 'neil-daren':{name:"Neil Daren",genre:{tr:"Modern Arena Rock",en:"Modern Arena Rock"},img:"neil-daren",gal:0,
   bio:{tr:"Chronos grubunun solisti; grup dağıldıktan sonra solo devam ediyor. Büyük melodiler ve güçlü radyo rock sound'uyla arena ölçeğinde bir ses.",en:"The frontman of the band Chronos, now continuing solo after the band disbanded. An arena-scale voice with big melodies and a powerful radio-rock sound."},
   styles:["Modern Rock","Arena Rock","Büyük melodiler","Güçlü radyo rock sound'u"]},
 'chronos':{name:"Chronos",genre:{tr:"Rock · Grup",en:"Rock · Band"},img:"chronos",gal:0,
   bio:{tr:"Aura Sonic çatısı altındaki rock grubu. Grup dağıldı; solisti Neil Daren solo kariyerine devam ediyor. Mirası katalogda yaşıyor.",en:"The rock band under the Aura Sonic roof. The band has disbanded; its frontman Neil Daren continues solo. Its legacy lives on in the catalog."},
   styles:["Rock","Arena Rock","Grup"]}
};
const I={tr:{back:"Sanatçılar",styleH:"Tarz & Stil",galH:"Kamera Arkası",contact:"İletişim",m_home:"Ana Sayfa",m_about:"Hakkımızda",m_artists:"Sanatçılarımız",m_vision:"Vizyonumuz",m_forartists:"Sanatçılar İçin",m_contact:"İletişim"},en:{back:"Artists",styleH:"Style & Genre",galH:"Behind the Scenes",contact:"Contact",m_home:"Home",m_about:"About",m_artists:"Our Artists",m_vision:"Our Vision",m_forartists:"For Artists",m_contact:"Contact"}};
let lang=localStorage.getItem('asLang')||'tr';
const slug=(new URLSearchParams(location.search).get('a'))||'askin-ozturk';
const d=A[slug]||A['askin-ozturk'];

function render(){
  document.getElementById('cover').src='images/artists/'+d.img+'.jpg';
  document.getElementById('cover').alt=d.name;
  document.getElementById('name').textContent=d.name;
  document.getElementById('genre').textContent=d.genre[lang];
  document.getElementById('bio').textContent=d.bio[lang];
  document.title=d.name+' — AURA SONIC OFFICIAL';
  const st=document.getElementById('styles');st.innerHTML='';
  d.styles.forEach(s=>{const e=document.createElement('span');e.textContent=s;st.appendChild(e)});
  const gal=document.getElementById('gal');gal.innerHTML='';
  if(d.gal>0){for(let i=1;i<=d.gal;i++){const a=document.createElement('a');const src='images/artists/gallery/'+d.img+'-'+i+'.jpg';a.href=src;a.target='_blank';a.innerHTML=`<img src="${src}" alt="${d.name}" loading="lazy" onerror="this.parentElement.style.display='none'">`;gal.appendChild(a)}}
  else{document.getElementById('galSec').style.display='none'}
}
function setLang(l){lang=l;localStorage.setItem('asLang',l);document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(e=>{if(I[l][e.dataset.i18n])e.textContent=I[l][e.dataset.i18n]});document.querySelectorAll('.lang span').forEach(s=>s.classList.toggle('on',s.dataset.lang===l));render()}
const dr=document.getElementById('drawer'),ov=document.getElementById('ov');
document.getElementById('menuBtn').onclick=()=>{dr.classList.add('open');ov.classList.add('open')};
ov.onclick=()=>{dr.classList.remove('open');ov.classList.remove('open')};
setLang(lang);
</script>
