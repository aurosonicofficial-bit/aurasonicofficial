<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Sonic Radio</title>
<style>
  :root{
    --gold:#C9A227; --gold2:#E8C84A; --bg:#0a0a0c; --panel:#141418; --txt:#fff; --mut:#9a9aa2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);
    display:flex;align-items:center;justify-content:center}
  .player{width:100%;max-width:440px;background:linear-gradient(160deg,#16131a,#0a0a0c);
    border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:30px 28px;
    text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(212,175,55,.06)}
  .logo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 14px;
    display:block;border:2px solid var(--gold);box-shadow:0 0 30px rgba(212,175,55,.3)}
  .name{font-size:22px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
  .sub{font-size:11px;letter-spacing:4px;color:var(--mut);text-transform:uppercase;margin-bottom:18px}
  .live{display:inline-flex;align-items:center;gap:7px;background:rgba(212,175,55,.12);
    border:1px solid rgba(212,175,55,.4);color:var(--gold2);padding:4px 14px;border-radius:30px;
    font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:22px}
  .live::before{content:"";width:8px;height:8px;background:#ff3b3b;border-radius:50%;
    box-shadow:0 0 8px #ff3b3b;animation:pulse 1.3s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .play{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1a1407;font-size:34px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    box-shadow:0 10px 30px rgba(212,175,55,.45);transition:transform .15s}
  .play:hover{transform:scale(1.06)}
  .play:active{transform:scale(.97)}
  .np{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .np .lbl{font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:6px}
  .np .art{font-size:15px;font-weight:700}
  .np .ttl{font-size:13px;color:var(--mut);margin-top:2px}
  .vol{display:flex;align-items:center;gap:10px;justify-content:center}
  .vol input{width:140px;accent-color:var(--gold)}
  .vol svg{fill:var(--mut)}
  .foot{margin-top:16px;font-size:10px;color:#55555c;letter-spacing:1px}
  audio{display:none}
</style>
</head>
<body>
<div class="player">
  <img class="logo" src="logo.png" alt="Aura Sonic" onerror="this.style.display='none'">
  <div class="name">AURA SONIC RADIO</div>
  <div class="sub">Official · 24/7</div>
  <div class="live">CANLI YAYIN</div>
  <button class="play" id="btn" aria-label="Oynat">&#9654;</button>
  <div class="np">
    <div class="lbl">&#9654; ŞİMDİ ÇALIYOR</div>
    <div class="art" id="art">Aura Sonic Radio</div>
    <div class="ttl" id="ttl">Cinematic · Latin · Synth Pop</div>
  </div>
  <div class="vol">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9">
  </div>
  <div class="foot">Distributed through Eğlence Fabrikası</div>
</div>
<audio id="a" preload="none"></audio>
<script>
  var STREAM = "https://stream.zeno.fm/cltwrkykhnqtv";
  var META   = "https://api.zeno.fm/mounts/metadata/subscribe/cltwrkykhnqtv";
  var a = document.getElementById('a');
  var btn = document.getElementById('btn');
  a.src = STREAM;
  document.getElementById('vol').oninput = function(){ a.volume = this.value; };
  a.volume = 0.9;
  btn.onclick = function(){
    if(a.paused){ a.src = STREAM; a.play(); btn.innerHTML="&#10073;&#10073;"; }
    else { a.pause(); btn.innerHTML="&#9654;"; }
  };
  // Canli sarki bilgisi (Zeno SSE)
  try{
    var es = new EventSource(META);
    es.onmessage = function(e){
      try{
        var d = JSON.parse(e.data);
        if(d.streamTitle){
          var p = d.streamTitle.split(" - ");
          document.getElementById('art').textContent = p[0] || d.streamTitle;
          document.getElementById('ttl').textContent = p.slice(1).join(" - ") || "";
        }
      }catch(_){}
    };
  }catch(_){}
</script>
</body>
</html>
