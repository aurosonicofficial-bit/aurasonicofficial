<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#C9A84C;--accent2:#E8C96A}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh}
a{color:inherit;text-decoration:none}

/* SLIDESHOW */
.stage{position:fixed;inset:0;background:#0a0a0a}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;filter:grayscale(1) contrast(1.04) brightness(.92)}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 22%,transparent 60%,rgba(0,0,0,.7) 100%)}
.slide.active img{animation:kb 8s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.12)}}

/* ARTIST NAME */
.slide-name{position:absolute;left:0;right:0;bottom:11%;text-align:center;z-index:5;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(34px,5.5vw,76px);letter-spacing:1px;color:var(--accent2);text-shadow:0 2px 30px rgba(0,0,0,.6);opacity:0;transform:translateY(14px);transition:.9s .4s}
.slide.active .slide-name{opacity:1;transform:translateY(0)}
.slide-genre{position:absolute;left:0;right:0;bottom:8.4%;text-align:center;z-index:5;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.7);opacity:0;transition:.9s .6s}
.slide.active .slide-genre{opacity:1}

/* TOP LOGO */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:124px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);display:flex;align-items:flex-start;justify-content:center;padding-top:18px}
.logo-center{text-align:center}
.logo-center img{height:54px;filter:brightness(0) invert(1) drop-shadow(0 0 1px rgba(0,0,0,.5))}
.logo-center .wm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:6px;color:#fff;margin-top:7px;text-transform:uppercase;opacity:.9}

/* MENU + NEWS */
.menu-btn{position:fixed;top:0;left:0;z-index:30;width:58px;height:58px;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.25s}
.menu-btn:hover{background:var(--accent2)}
.menu-btn span{width:24px;height:2px;background:#000}
.news-btn{position:fixed;top:0;right:0;z-index:30;height:58px;padding:0 26px;background:rgba(20,20,20,.85);display:flex;align-items:center;font-size:12px;letter-spacing:3px;cursor:pointer;transition:.25s}
.news-btn:hover{color:var(--accent)}

/* ARROWS */
.nav-arrow{position:fixed;right:0;z-index:25;width:48px;height:50px;background:rgba(15,15,15,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px;transition:.25s;border:none}
.nav-arrow:hover{background:var(--accent);color:#000}
.nav-prev{top:calc(50% - 50px)}
.nav-next{top:50%}

/* PROGRESS DOTS */
.dots{position:fixed;bottom:78px;left:0;right:0;z-index:15;display:flex;justify-content:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.dot.on{background:var(--accent);width:22px;border-radius:3px}

/* FOOTER BAR */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;height:48px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:rgba(255,255,255,.55)}
.foot-social{display:flex;gap:18px;font-size:14px}
.foot-social a{transition:.2s;opacity:.7}
.foot-social a:hover{opacity:1;color:var(--accent)}
.foot-legal{display:flex;gap:14px}
.foot-legal a:hover{color:var(--accent)}

/* SLIDE-OUT MENU */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:.4s}
.drawer.open{opacity:1;pointer-events:auto}
.drawer a{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(28px,5vw,48px);color:#fff;transition:.25s}
.drawer a:hover{color:var(--accent)}
.drawer .close{position:absolute;top:20px;left:20px;width:58px;height:58px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;color:#000;cursor:pointer}
.drawer .d-contact{margin-top:30px;font-family:'Montserrat';font-style:normal;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.6)}

@media(max-width:640px){
  .foot-legal{display:none}
  .logo-center img{height:42px}
}

<body>

</div>

<script>
const ARTISTS = [
  {n:"Aşkın Öztürk", g:"Kurucu · Vokal", img:"askin-ozturk"},
  {n:"Kael Voss", g:"Alternative", img:"kael-voss"},
  {n:"Vael Cross", g:"Cinematic", img:"vael-cross"},
  {n:"Maria Mel", g:"Pop · Latin", img:"maria-mel"},
  {n:"Chronos", g:"Electronic", img:"chronos"},
  {n:"Lyra Sage", g:"Indie", img:"lyra-sage"},
  {n:"Lara", g:"Türkçe Pop", img:"lara"},
  {n:"Jaxen Moon", g:"R&B · Soul", img:"jaxen-moon"},
  {n:"İrem Sezin", g:"Türkçe", img:"irem-sezin"},
  {n:"Naxo Veyra", g:"Dance", img:"naxo-veyra"}
];
const stage = document.getElementById('stage');
const dots = document.getElementById('dots');
ARTISTS.forEach((a,i)=>{
  const s = document.createElement('div');
  s.className = 'slide' + (i===0?' active':'');
  s.innerHTML = `<img src="images/artists/${a.img}.jpg" alt="${a.n}" loading="${i<2?'eager':'lazy'}">
    <div class="slide-name">${a.n}</div>
    <div class="slide-genre">${a.g}</div>`;
  stage.appendChild(s);
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' on':'');
  d.onclick = ()=>show(i);
  dots.appendChild(d);
});
let cur = 0, timer;
const slides = document.querySelectorAll('.slide');
const allDots = document.querySelectorAll('.dot');
function show(i){
  slides[cur].classList.remove('active');
  allDots[cur].classList.remove('on');
  cur = (i+ARTISTS.length)%ARTISTS.length;
  slides[cur].classList.add('active');
  allDots[cur].classList.add('on');
  restart();
}
function go(d){ show(cur+d); }
function restart(){ clearInterval(timer); timer=setInterval(()=>go(1),6000); }
restart();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script>
