<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sanatçılarımız — AURA SONIC OFFICIAL</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AURA SONIC OFFICIAL sanatçıları — bağımsız müzik şirketimizin kadrosu.">
<link rel="icon" href="aurasonicofficial-logo.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TLFGYP8XR2"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-TLFGYP8XR2');</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--gold2:#E8C96A}
body{font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;line-height:1.7}
a{color:inherit;text-decoration:none}
.menu-btn{position:fixed;top:0;left:0;z-index:60;width:60px;height:60px;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.25s}
.menu-btn:hover{background:var(--gold2)}.menu-btn span{width:24px;height:2px;background:#0a0a0a}
.topbar{position:fixed;top:8px;left:78px;z-index:50;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .35s}
.topbar img{height:96px;filter:drop-shadow(0 3px 16px rgba(0,0,0,.7))}
body.menu-open .topbar{transform:translateX(-150%);opacity:0}
.lang-btn{position:fixed;top:0;right:0;z-index:55;height:60px;padding:0 24px;background:rgba(18,18,18,.92);display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;cursor:pointer}
.lang-btn span{opacity:.5;transition:.2s}.lang-btn span.on{opacity:1;color:var(--gold)}.lang-btn span:hover{opacity:1}
.hero{height:42vh;min-height:300px;position:relative;display:flex;align-items:flex-end;overflow:hidden;background:#111}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#1a1a1a,#0a0a0a 70%)}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 20%,rgba(201,168,76,.14),transparent 60%)}
.hero-in{position:relative;z-index:2;padding:0 8% 50px;width:100%}
.hero .crumb{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;opacity:.85}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(44px,8vw,90px);font-weight:500;line-height:.96}
.hero .uline{width:60px;height:3px;background:var(--gold);margin-top:20px}
.grid{max-width:1280px;margin:0 auto;padding:64px 6% 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:#161616;cursor:pointer}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;filter:grayscale(.4) contrast(1.03);transition:.6s}
.card:hover img{filter:grayscale(0);transform:scale(1.05)}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,.95),transparent 45%)}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:20px;z-index:2}
.card .n{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--gold2);line-height:1}
.card .g{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:6px}
.card .ln{position:absolute;left:20px;bottom:14px;width:0;height:2px;background:var(--gold);z-index:3;transition:.4s}
.card:hover .ln{width:38px}
footer{border-top:1px solid rgba(255,255,255,.08);padding:40px 8%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;font-size:12px;color:rgba(255,255,255,.5)}
footer a:hover{color:var(--gold)}.f-social{display:flex;gap:18px;font-size:15px}
.drawer{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:84vw;z-index:65;background:#0d0d0d;border-right:1px solid rgba(201,168,76,.18);transform:translateX(-100%);transition:.42s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:90px 0 30px}
.drawer.open{transform:translateX(0)}
.drawer-ov{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.4s}.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer nav{flex:1;display:flex;flex-direction:column}
.drawer nav a{padding:15px 36px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.82);border-left:3px solid transparent;transition:.22s}
.drawer nav a:hover,.drawer nav a.active{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.05)}
.drawer-foot{padding:22px 36px 0;border-top:1px solid rgba(255,255,255,.07);margin-top:14px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.7}
@media(max-width:640px){.topbar img{height:62px}.topbar{left:70px}}
</style>
</head>
<body>
<div class="menu-btn" id="menuBtn"><span></span><span></span><span></span></div>
<a class="topbar" href="index.html"><img src="aura-logo-gold.png" alt="AURA SONIC OFFICIAL" onerror="this.src='aurasonicofficial-logo.png'"></a>
<div class="lang-btn"><span class="on" data-lang="tr" onclick="setLang('tr')">TR</span><span data-lang="en" onclick="setLang('en')">EN</span></div>

<section class="hero"><div class="hero-in">
  <div class="crumb"><span data-i18n="crumb">Ana Sayfa › Sanatçılarımız</span></div>
  <h1 data-i18n="title">Sanatçılarımız</h1>
  <div class="uline"></div>
</div></section>

<div class="grid" id="grid"></div>

<footer>
  <span>© 2026 AURA SONIC OFFICIAL GROUP LTD</span>
  <div class="f-social"><a href="https://instagram.com/aurasonic.official">◉</a><a href="https://wa.me/447882747808">✆</a><a href="mailto:info@aurasonicofficial.co.uk">✉</a></div>
  <a href="iletisim.html" data-i18n="contact">İletişim</a>
</footer>

<div class="drawer-ov" id="ov"></div>
<aside class="drawer" id="drawer"><nav>
  <a href="index.html" data-i18n="m_home">Ana Sayfa</a>
  <a href="hakkimizda.html" data-i18n="m_about">Hakkımızda</a>
  <a href="sanatcilar.html" class="active" data-i18n="m_artists">Sanatçılarımız</a>
  <a href="vizyon.html" data-i18n="m_vision">Vizyonumuz</a>
  <a href="sanatcilar-icin.html" data-i18n="m_forartists">Sanatçılar İçin</a>
  <a href="iletisim.html" data-i18n="m_contact">İletişim</a>
</nav><div class="drawer-foot">AURA SONIC OFFICIAL GROUP LTD<br>London · İzmir</div></aside>

<script>
const ARTISTS=[
 {n:"Aşkın Öztürk",g:{tr:"Kurucu · Vokal",en:"Founder · Vocals"},img:"askin-ozturk"},
 {n:"Kael Voss",g:{tr:"Alternatif",en:"Alternative"},img:"kael-voss"},
 {n:"Vael Cross",g:{tr:"Sinematik",en:"Cinematic"},img:"vael-cross"},
 {n:"Maria Mel",g:{tr:"Pop · Latin",en:"Pop · Latin"},img:"maria-mel"},
 {n:"Lyra Sage",g:{tr:"Indie",en:"Indie"},img:"lyra-sage"},
 {n:"Lara",g:{tr:"Türkçe Pop",en:"Turkish Pop"},img:"lara"},
 {n:"Jaxen Moon",g:{tr:"R&B · Soul",en:"R&B · Soul"},img:"jaxen-moon"},
 {n:"İrem Sezin",g:{tr:"Türkçe",en:"Turkish"},img:"irem-sezin"},
 {n:"Naxo Veyra",g:{tr:"Dance",en:"Dance"},img:"naxo-veyra"}
];
const T={tr:{crumb:"Ana Sayfa › Sanatçılarımız",title:"Sanatçılarımız",contact:"İletişim",m_home:"Ana Sayfa",m_about:"Hakkımızda",m_artists:"Sanatçılarımız",m_vision:"Vizyonumuz",m_forartists:"Sanatçılar İçin",m_contact:"İletişim"},en:{crumb:"Home › Our Artists",title:"Our Artists",contact:"Contact",m_home:"Home",m_about:"About",m_artists:"Our Artists",m_vision:"Our Vision",m_forartists:"For Artists",m_contact:"Contact"}};
let lang=localStorage.getItem('asLang')||'tr';
const grid=document.getElementById('grid');
ARTISTS.forEach(a=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="images/artists/${a.img}.jpg" alt="${a.n}" loading="lazy"><div class="info"><div class="n">${a.n}</div><div class="g" data-genre>${a.g[lang]}</div></div><div class="ln"></div>`;grid.appendChild(c)});
function setLang(l){lang=l;localStorage.setItem('asLang',l);document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(e=>{if(T[l][e.dataset.i18n])e.innerHTML=T[l][e.dataset.i18n]});document.querySelectorAll('[data-genre]').forEach((e,i)=>e.textContent=ARTISTS[i].g[l]);document.querySelectorAll('.lang-btn span').forEach(s=>s.classList.toggle('on',s.dataset.lang===l))}
const dr=document.getElementById('drawer'),ov=document.getElementById('ov');
document.getElementById('menuBtn').onclick=()=>{dr.classList.add('open');ov.classList.add('open');document.body.classList.add('menu-open')};
ov.onclick=()=>{dr.classList.remove('open');ov.classList.remove('open');document.body.classList.remove('menu-open')};
setLang(lang);
</script>
</body>
</html>
